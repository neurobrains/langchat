[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = ^build/|^dist/|^\.venv/|^venv/|^__pycache__/|^tests/
follow_imports = normal
show_error_codes = True

[[mypy.supabase.*]]
ignore_missing_imports = True
follow_imports = skip

[[mypy.langchain.*]]
ignore_missing_imports = True

[[mypy.pinecone.*]]
ignore_missing_imports = True

[[mypy.flashrank.*]]
ignore_missing_imports = True

[[mypy.docsuite.*]]
ignore_missing_imports = True

[[mypy.sqlalchemy]]
ignore_errors = True
ignore_missing_imports = True
follow_imports = skip

[[mypy.sqlalchemy.*]]
ignore_errors = True
ignore_missing_imports = True
follow_imports = skip

[[mypy.mcp.*]]
ignore_errors = True


