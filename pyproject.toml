[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchat"
version = "1.0.2"
description = "A powerful library for shipping production-grade AI chatbots in minutes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sifat Hasan", email = "sihabhossan633@gmail.com"},
    {name = "IMRANEMU",    email = "alimransujon1@gmail.com"},
]
keywords = ["rag", "llm", "ai", "langchain", "chatbot", "vector-search", "retrieval-augmented-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.14",
    "uvicorn>=0.34.3",
    "starlette>=0.46.2",
    "pydantic>=2.11.7",
    "python-multipart>=0.0.20",
    "pytz>=2022.7",
    "requests>=2.32.3",
    "python-dotenv>=1.0.0",
    "langchain==0.3.27",
    "langchain-core>=0.3.72,<1.0.0",
    "langchain-pinecone>=0.1.0,<0.3.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "openai>=1.0.0",
    "tiktoken>=0.9.0",
    "pinecone-client>=3.0.0",
    "flashrank>=0.2.10",
    "supabase>=2.15.2",
    "docsuite>=0.1.0",
    "pyperclip>=1.11.0",
    "rich>=13.0.0",
    "faiss-cpu>=1.7.0",
]

[project.urls]
Homepage      = "https://langchat.neurobrains.co"
Repository    = "https://github.com/neurobrains/langchat"
Documentation = "https://langchat.neurobrains.co"
"Bug Tracker" = "https://github.com/neurobrains/langchat/issues"
Changelog     = "https://github.com/neurobrains/langchat/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Optional / dev dependencies
# ---------------------------------------------------------------------------

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "ty>=0.0.1",
]

# ---------------------------------------------------------------------------
# uv — fast Python package manager
# ---------------------------------------------------------------------------

[tool.uv]
# (add index overrides or VCS sources here if needed)

# ---------------------------------------------------------------------------
# setuptools
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --tb=short"

# ---------------------------------------------------------------------------
# ruff — linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length    = 100
target-version = "py39"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
    "ARG001", # unused function argument (common in hooks/callbacks)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",    # unused arguments are fine in test helpers
    "FBT",    # boolean positional values in tests
    "SIM117", # nested with-statements in pytest.raises blocks
]

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false
line-ending              = "auto"

# ---------------------------------------------------------------------------
# ty — type checker
# ---------------------------------------------------------------------------

[tool.ty.rules]
unresolved-import = "ignore"
